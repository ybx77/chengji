<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成绩录入</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #a8b4fc;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      border: 1px solid #2a2a45;
    }

    .card-title {
      font-size: 13px;
      color: #6b7db3;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---- 摄像头 ---- */
    .camera-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    #canvas { display: none; }

    .guide-box {
      position: absolute;
      border: 2px dashed rgba(168, 180, 252, 0.5);
      border-radius: 8px;
      pointer-events: none;
    }

    #guide-name {
      top: 40%; left: 5%; width: 45%; height: 35%;
      border-color: rgba(100, 255, 150, 0.6);
    }

    .guide-label {
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    #guide-name .guide-label { background: rgba(100, 255, 150, 0.2); color: #6dffaa; }

    .guide-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      pointer-events: none;
    }

    /* ---- 识别结果 ---- */
    .result-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .result-box {
      flex: 1;
      background: #12122a;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #2a2a45;
    }

    .result-label {
      font-size: 11px;
      color: #6b7db3;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .result-value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
    }

    .result-value.empty { color: #3a3a5a; font-size: 16px; font-weight: 400; letter-spacing: 0; }

    /* ---- 按钮 ---- */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #5b8dee, #7c6df0);
      color: #fff;
    }

    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: #2a2a45;
      color: #a8b4fc;
    }

    .btn-secondary:active { background: #33335a; }

    .btn-success {
      background: linear-gradient(135deg, #34c97a, #2ba865);
      color: #fff;
    }

    .btn-success:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---- Excel 区 ---- */
    .file-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="file"] { display: none; }

    .file-label {
      padding: 10px 14px;
      background: #2a2a45;
      border-radius: 10px;
      font-size: 13px;
      color: #a8b4fc;
      cursor: pointer;
      border: 1px solid #3a3a5a;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .file-label:hover { background: #33335a; }

    .file-info {
      font-size: 12px;
      color: #6b7db3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- 已录入列表 ---- */
    .record-list {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .record-list::-webkit-scrollbar { width: 4px; }
    .record-list::-webkit-scrollbar-track { background: transparent; }
    .record-list::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 4px; }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1e1e35;
      font-size: 14px;
    }

    .record-item:last-child { border-bottom: none; }

    .record-name { color: #c8d0fc; font-weight: 500; }
    .record-score { color: #ffcc66; font-weight: 700; font-size: 16px; }
    .record-time { color: #4a4a7a; font-size: 11px; }

    .empty-hint {
      text-align: center;
      color: #3a3a5a;
      font-size: 13px;
      padding: 24px 0;
    }

    /* ---- 状态栏 ---- */
    #status {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 20px;
      background: #1a1a2e;
      color: #6b7db3;
      margin-bottom: 10px;
      text-align: center;
      border: 1px solid #2a2a45;
      max-width: 480px;
      width: 100%;
      transition: all 0.3s;
    }

    #status.loading {
      color: #ffcc66;
      border-color: rgba(255, 200, 100, 0.3);
    }

    #status.ok {
      color: #6dffaa;
      border-color: rgba(100, 255, 150, 0.3);
    }

    #status.err {
      color: #ff8888;
      border-color: rgba(255, 100, 100, 0.3);
    }

    /* ---- 确认弹窗 ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #2a2a45;
    }

    .modal h2 {
      font-size: 17px;
      color: #a8b4fc;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-field {
      margin-bottom: 14px;
    }

    .modal-field label {
      display: block;
      font-size: 12px;
      color: #6b7db3;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .modal-field input {
      width: 100%;
      padding: 12px;
      background: #12122a;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }

    .modal-field input:focus { border-color: #5b8dee; }

    .modal-field input.score { color: #ffcc66; }

    .modal .btn-row { margin-top: 18px; }

    /* ---- OCR 进度环 ---- */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .loading .spinner { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- 导出按钮 ---- */
    .export-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* ---- 识别置信度 ---- */
    .confidence-bar {
      height: 3px;
      background: #2a2a45;
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #5b8dee, #7c6df0);
      transition: width 0.3s;
    }
    /* ---- 识别结果候选名 ---- */
    .candidates-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .candidate-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #2a2a45;
      background: #12122a;
      color: #a8b4fc;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .candidate-btn:hover { background: #1e1e3a; border-color: #5b8dee; }

    .candidate-btn.selected {
      background: linear-gradient(135deg, #5b8dee, #7c6df0);
      border-color: transparent;
      color: #fff;
    }

    .candidate-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      color: inherit;
      min-width: 36px;
      text-align: center;
    }

    .candidate-btn.selected .candidate-badge { background: rgba(255,255,255,0.25); }

    .no-candidates {
      text-align: center;
      color: #4a4a7a;
      font-size: 13px;
      padding: 12px;
      background: #12122a;
      border-radius: 10px;
      border: 1px dashed #2a2a45;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <h1>成绩录入</h1>

  <div id="status">点击「拍照识别」开始</div>

  <!-- 摄像头 -->
  <div class="card">
    <div class="card-title">摄像头</div>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <div id="guide-name" class="guide-box">
        <span class="guide-label">姓名</span>
      </div>
      <div class="guide-hint">将姓名对准绿框内</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-camera" onclick="toggleCamera()">打开摄像头</button>
      <button class="btn btn-primary" id="btn-capture" onclick="captureAndRecognize()" disabled>
        <span class="spinner"></span>
        <span class="btn-text">拍照识别</span>
      </button>
    </div>
  </div>

    <!-- 识别结果 -->
  <div class="card" id="result-card" style="display:none">
    <div class="card-title">识别结果</div>
    <!-- 候选姓名区域（动态生成） -->
    <div id="candidates-wrap" class="candidates-wrap"></div>
    <div id="no-candidates" class="no-candidates" style="display:none">未识别到文字，请保持适当距离重拍</div>
    <!-- 成绩 -->
    <div class="result-box" style="margin-bottom:12px">
      <div class="result-label">成绩</div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px">
        <button class="btn btn-secondary" style="padding:6px 12px;font-size:18px;flex:none" onclick="adjustScore(-5)">−</button>
        <div class="result-value" id="result-score" style="min-width:44px;text-align:center">80</div>
        <button class="btn btn-secondary" style="padding:6px 12px;font-size:18px;flex:none" onclick="adjustScore(5)">+</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="retryRecognize()">重新识别</button>
      <button class="btn btn-success" id="btn-confirm" onclick="showConfirm()" disabled>确认录入</button>
    </div>
  </div>

  <!-- Excel 名单 -->
  <div class="card">
    <div class="card-title">学生名单</div>
    <div class="file-input-wrap">
      <label class="file-label" for="file-excel">📂 导入 Excel</label>
      <input type="file" id="file-excel" accept=".xlsx,.xls" onchange="loadExcel(this.files[0])">
      <span class="file-info" id="excel-info">未导入</span>
    </div>
    <div id="name-list" class="record-list" style="margin-top:10px; max-height:120px">
      <div class="empty-hint">请先导入包含学生姓名的 Excel</div>
    </div>
  </div>

  <!-- 已录入记录 -->
  <div class="card">
    <div class="card-title">已录入 <span id="record-count" style="font-size:11px;color:#3a3a5a">(0)</span></div>
    <div id="record-list" class="record-list">
      <div class="empty-hint">暂无录入记录</div>
    </div>
    <div class="export-row">
      <button class="btn btn-secondary" style="flex:1" onclick="exportExcel()">导出 Excel</button>
      <button class="btn btn-secondary" style="flex:1" onclick="clearRecords()">清空记录</button>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>确认录入</h2>
      <div class="modal-field">
        <label>姓名</label>
        <input type="text" id="modal-name" readonly>
      </div>
      <div class="modal-field">
        <label>成绩</label>
        <div style="text-align:center;font-size:22px;font-weight:700;color:#ffcc66;padding:12px;background:#12122a;border:1px solid #2a2a45;border-radius:10px" id="modal-score-display">80</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-success" onclick="confirmRecord()">确认</button>
      </div>
    </div>
  </div>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // ===== 全局状态 =====
    let stream = null;
    let cameraOn = false;
    let studentNames = [];         // 姓名列表
    let worker = null;
    let _lastCandidates = [];     // 上一次的候选列表
    let isRecognizing = false;     // 防止重复识别

    // 原始 Excel 数据（用于导出时写入）
    let originalExcelBuffer = null; // ArrayBuffer
    let scoreColIndex = -1;        // 成绩列索引（0-based）
    let studentRows = [];          // [{rowIndex, name, hasScore}]

    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    // ===== 状态提示 =====
    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    // ===== 摄像头 =====
    async function toggleCamera() {
      const btn = document.getElementById('btn-camera');
      if (!cameraOn) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
          });
          video.srcObject = stream;
          await video.play();
          cameraOn = true;
          btn.textContent = '关闭摄像头';
          document.getElementById('btn-capture').disabled = false;
          setStatus('摄像头已打开，姓名框只放姓名文字，保持适当距离', 'ok');
          initOCRWorker();
        } catch (e) {
          setStatus('摄像头权限被拒绝：' + e.message, 'err');
        }
      } else {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        cameraOn = false;
        btn.textContent = '打开摄像头';
        document.getElementById('btn-capture').disabled = true;
        setStatus('摄像头已关闭', '');
      }
    }

    // ===== OCR Worker 初始化 =====
    async function initOCRWorker() {
      if (worker) return;
      setStatus('正在加载 OCR 模型（首次约需30秒）...', 'loading');
      try {
        worker = await Tesseract.createWorker('chi_sim', 1, {
          cacheMethod: 'indexedDB',
          logger: m => {
            if (m.status === 'recognizing text') {
              setStatus(`识别中 ${Math.round(m.progress * 100)}%`, 'loading');
            }
          }
        });
        setStatus('OCR 就绪，请拍照识别', 'ok');
      } catch (e) {
        setStatus('OCR 加载失败：' + e.message, 'err');
      }
    }

    // ===== 拍照并识别 =====
    async function captureAndRecognize() {
      if (isRecognizing) return;
      if (!worker) { setStatus('OCR 正在初始化，请稍候', 'loading'); return; }
      if (!cameraOn) { setStatus('请先打开摄像头', 'err'); return; }

      isRecognizing = true;
      const btn = document.getElementById('btn-capture');
      btn.disabled = true;
      btn.classList.add('loading');
      setStatus('正在拍摄...', 'loading');

      try {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const fullW = canvas.width, fullH = canvas.height;
        const sx = Math.floor(fullW * 0.05), sy = Math.floor(fullH * 0.30);
        const sw = Math.floor(fullW * 0.45), sh = Math.floor(fullH * 0.45);

        // 目标：320×240（正好是 Tesseract 推荐的小图尺寸，大幅加速识别）
        const TW = 320, TH = 240;

        // crop → resize → 灰度 → 转 Blob，全程 Canvas API，无 JS 像素循环
        const crop = document.createElement('canvas');
        crop.width = TW; crop.height = TH;
        const cctx = crop.getContext('2d');
        cctx.imageSmoothingEnabled = false;
        cctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, TW, TH);

        // Canvas 灰度化（比逐像素 JS 快数十倍）
        const gray = document.createElement('canvas');
        gray.width = TW; gray.height = TH;
        const gctx = gray.getContext('2d');
        gctx.drawImage(crop, 0, 0);
        const imgData = gctx.getImageData(0, 0, TW, TH);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          d[i] = d[i+1] = d[i+2] = (d[i] * 299 + d[i+1] * 587 + d[i+2] * 114 + 500) / 1000;
        }
        gctx.putImageData(imgData, 0, 0);

        // Tesseract 接受 canvas、data URL 或 ImageData
        const result = await worker.recognize(gray);
        const text = result.data.text.trim().replace(/[^\u4e00-\u9fff]/g, '');
        const cands = text ? rankCandidates(text) : [];

        displayCandidates(cands);

      } catch (e) {
        setStatus('识别失败：' + e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        isRecognizing = false;
      }
    }


    // ===== 对所有名单打分并排序 =====
    function rankCandidates(text) {
      if (!text || studentNames.length === 0) return [];

      const scored = studentNames.map(cn => {
        let score = 0;

        // 精确包含 → 最高分
        if (text.includes(cn)) {
          score = 100 + cn.length * 5;
        } else {
          // 每个姓名字在 OCR 结果中出现的次数
          let matched = 0;
          for (const ch of cn) {
            if (text.includes(ch)) matched++;
          }
          const ratio = matched / cn.length;
          score = Math.round(ratio * 80);

          // 前缀匹配加分
          if (cn.startsWith(text)) score += 40;
          else if (cn.startsWith(text.slice(0, 1))) score += 10;

          // 编辑距离
          const dist = levenshtein(cn, text);
          if (dist === 0) score = 100;
          else if (dist === 1) score = Math.max(score, 90);
          else if (dist === 2) score = Math.max(score, 70);
        }

        return { name: cn, score };
      });

      return scored
        .filter(c => c.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 5); // 最多5个候选
    }

    // ===== 展示候选列表 =====
    let selectedName = null; // 当前选中的姓名

    function displayCandidates(candidates) {
      _lastCandidates = candidates;
      document.getElementById('result-card').style.display = 'block';
      pendingScore = 80;

      const wrap = document.getElementById('candidates-wrap');
      const noCand = document.getElementById('no-candidates');
      const scoreEl = document.getElementById('result-score');
      const btnConfirm = document.getElementById('btn-confirm');

      scoreEl.textContent = '80';

      if (candidates.length === 0) {
        wrap.innerHTML = '';
        noCand.style.display = 'block';
        btnConfirm.disabled = true;
        selectedName = null;
        setStatus('未识别到文字，请保持适当距离重拍', 'err');
        return;
      }

      noCand.style.display = 'none';

      const top3 = candidates.slice(0, 3);
      wrap.innerHTML = top3.map((c, i) => `
        <button class="candidate-btn${i === 0 ? ' selected' : ''}" onclick="selectCandidate(${i})">
          ${c.name}
          <span class="candidate-badge">${c.score}%</span>
        </button>
      `).join('');

      selectedName = top3[0].name;
      btnConfirm.disabled = false;
      setStatus(`识别完成，请选择姓名后确认`, 'ok');
    }

    function selectCandidate(index) {
      const btns = document.querySelectorAll('.candidate-btn');
      btns.forEach((b, i) => b.classList.toggle('selected', i === index));
      selectedName = _lastCandidates[index]?.name || null;
    }

    // ===== 成绩增减（以5为单位）=====
    function adjustScore(delta) {
      pendingScore = Math.max(0, Math.min(100, pendingScore + delta));
      document.getElementById('result-score').textContent = pendingScore;
    }

    // ===== 辅助函数 =====
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n; if (n === 0) return m;
      const d = Array.from({ length: m + 1 }, (_, i) => [i]);
      for (let j = 0; j <= n; j++) d[0][j] = j;
      for (let i = 1; i <= m; i++)
        for (let j = 1; j <= n; j++)
          d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
      return d[m][n];
    }

    function retryRecognize() {
      document.getElementById('result-card').style.display = 'none';
      setStatus('请重新拍照识别', '');
    }

    // ===== Excel 导入（读取姓名列 + 定位成绩列）=====
    async function loadExcel(file) {
      if (!file) return;
      document.getElementById('excel-info').textContent = '加载中...';

      const buf = await file.arrayBuffer();
      originalExcelBuffer = buf.slice(0); // 克隆保存

      const zip  = await JSZip.loadAsync(buf);
      const sheets = Object.keys(zip.files).filter(k => k.endsWith('.xml') && !k.startsWith('_rels'));

      studentNames = [];
      studentRows  = [];
      scoreColIndex = -1;

      const skipWords = new Set(['姓名', '成绩', '学号', '分数', '总分', '实验', '班级', '专业', '学院', '学校', '座号', '序号', '编号', '分', '报告', '标题', '课程']);

      for (const sheetFile of sheets) {
        const xml   = await zip.file(sheetFile).async('string');
        const parser = new DOMParser();
        const doc   = parser.parseFromString(xml, 'text/xml');

        const sharedStrings = [];
        const ssFile = zip.file('xl/sharedStrings.xml');
        if (ssFile) {
          const ssXml = await ssFile.async('string');
          const ssDoc = parser.parseFromString(ssXml, 'text/xml');
          ssDoc.querySelectorAll('si t').forEach(t => {
            sharedStrings.push(t.textContent.trim());
          });
        }

        // 精确找姓名列和成绩列索引
        const allRows = doc.querySelectorAll('row');
        if (allRows.length === 0) continue;

        let nameColIdx = -1, scoreColIdx = -1;
        const headerCells = allRows[0].querySelectorAll('c');
        headerCells.forEach((cell, ci) => {
          let val = '';
          const t = cell.getAttribute('t');
          if (t === 's') {
            val = sharedStrings[parseInt(cell.querySelector('v')?.textContent || '0')] || '';
          } else {
            val = cell.querySelector('v')?.textContent || '';
          }
          val = val.trim();
          if (val.includes('姓名')) nameColIdx = ci;
          if (val.includes('成绩') || val.includes('得分') || val.includes('分数')) scoreColIdx = ci;
        });

        if (nameColIdx < 0) {
          document.getElementById('excel-info').textContent = '未找到姓名列';
          setStatus('Excel 表头未包含"姓名"列', 'err');
          return;
        }

        // 读取姓名列数据
        for (let ri = 1; ri < allRows.length; ri++) {
          const row = allRows[ri];
          const cells = row.querySelectorAll('c');
          if (cells.length <= nameColIdx) continue;

          let nameVal = '';
          const nameCell = cells[nameColIdx];
          const t = nameCell?.getAttribute('t');
          if (t === 's') {
            nameVal = sharedStrings[parseInt(nameCell.querySelector('v')?.textContent || '0')] || '';
          } else {
            nameVal = nameCell?.querySelector('v')?.textContent || '';
          }
          nameVal = nameVal.trim();

          if (nameVal.length >= 2 && nameVal.length <= 4 && /^[\u4e00-\u9fff]+$/.test(nameVal) && !skipWords.has(nameVal)) {
            if (!studentNames.includes(nameVal)) {
              studentNames.push(nameVal);
              studentRows.push({ name: nameVal, rowIndex: ri, hasScore: false });
            }
          }

          // 检查成绩列是否有值
          if (scoreColIdx >= 0 && cells.length > scoreColIdx) {
            const scoreCell = cells[scoreColIdx];
            let scoreVal = '';
            const st = scoreCell?.getAttribute('t');
            if (st === 's') {
              scoreVal = sharedStrings[parseInt(scoreCell.querySelector('v')?.textContent || '0')] || '';
            } else {
              scoreVal = scoreCell?.querySelector('v')?.textContent || '';
            }
            if (scoreVal.trim()) {
              const sr = studentRows.find(r => r.name === nameVal);
              if (sr) sr.hasScore = true;
            }
          }
        }

        scoreColIndex = scoreColIdx;
      }

      studentNames = [...new Set(studentNames)];
      const loaded = studentRows.length;
      const scored = studentRows.filter(r => r.hasScore).length;
      document.getElementById('excel-info').textContent = `${loaded} 人（${scored} 人已有成绩）`;
      renderNameList();
      setStatus(`已加载 ${studentNames.length} 名学生`, 'ok');
    }

    function renderNameList() {
      const el = document.getElementById('name-list');
      if (studentNames.length === 0) {
        el.innerHTML = '<div class="empty-hint">未找到学生姓名</div>';
        return;
      }
      el.innerHTML = studentNames.slice(0, 30).map(n =>
        `<span style="display:inline-block;padding:4px 10px;margin:2px;background:#12122a;border-radius:6px;font-size:12px;color:#6b7db3">${n}</span>`
      ).join('') + (studentNames.length > 30 ? `<div style="font-size:12px;color:#3a3a5a;margin-top:6px">...共 ${studentNames.length} 人</div>` : '');
    }

    // ===== 确认录入（写入原 Excel 表格）=====
    let enteredNames = new Set(); // 已录入的姓名

    function showConfirm() {
      if (!selectedName) { alert('请先选择姓名'); return; }
      document.getElementById('modal').classList.add('show');
      document.getElementById('modal-name').value = selectedName;
      document.getElementById('modal-score-display').textContent = pendingScore;
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function confirmRecord() {
      const name = document.getElementById('modal-name').value.trim();
      if (!name) { alert('姓名不能为空'); return; }

      if (!originalExcelBuffer) {
        alert('请先导入 Excel 文件');
        closeModal();
        return;
      }

      // 在 Excel 中找到该姓名所在行，写入成绩
      const result = writeScoreToExcel(name, pendingScore);
      if (!result.ok) {
        alert(result.msg);
        closeModal();
        return;
      }

      enteredNames.add(name);
      closeModal();
      document.getElementById('result-card').style.display = 'none';
      renderEnteredList();
      setStatus(`「${name}」成绩已写入 Excel`, 'ok');
    }

    function renderEnteredList() {
      const el = document.getElementById('record-list');
      if (enteredNames.size === 0) {
        el.innerHTML = '<div class="empty-hint">暂无录入记录</div>';
        document.getElementById('record-count').textContent = '(0)';
        return;
      }
      const arr = [...enteredNames];
      el.innerHTML = arr.map(n =>
        `<div class="record-item">
          <span class="record-name">${n}</span>
          <span class="record-score">✓</span>
        </div>`
      ).join('');
      document.getElementById('record-count').textContent = `(${arr.length})`;
    }

    function clearRecords() {
      if (!confirm('确定清空所有录入记录？')) return;
      enteredNames = new Set();
      // 重置 Excel 写入状态
      studentRows.forEach(r => r.entered = false);
      renderEnteredList();
      setStatus('已清空记录', '');
    }

    // ===== 写入成绩到 Excel（内存修改）=====
    function writeScoreToExcel(name, score) {
      const targetRow = studentRows.find(r => r.name === name);
      if (!targetRow) return { ok: false, msg: `名单中未找到「${name}」` };
      if (targetRow.hasScore) {
        // 已有成绩，是否覆盖？
        if (!confirm(`「${name}」已有成绩，确认覆盖吗？`)) {
          return { ok: false, msg: '已取消' };
        }
      }
      targetRow.score = score;
      targetRow.entered = true;
      return { ok: true };
    }

    // ===== 导出修改后的 Excel =====
    async function exportExcel() {
      if (enteredNames.size === 0) { alert('没有可导出的录入记录'); return; }
      if (!originalExcelBuffer) { alert('未找到原始 Excel，请重新导入'); return; }

      try {
        const zip = await JSZip.loadAsync(originalExcelBuffer);
        const sheets = Object.keys(zip.files).filter(k => k.endsWith('.xml') && !k.startsWith('_rels'));
        const sheetFile = sheets[0];
        const wsXml = await zip.file(sheetFile).async('string');

        // 读取 sharedStrings
        const sharedStrings = [];
        const ssFile = zip.file('xl/sharedStrings.xml');
        if (ssFile) {
          const ssDoc = new DOMParser().parseFromString(await ssFile.async('string'), 'text/xml');
          ssDoc.querySelectorAll('si t').forEach(t => sharedStrings.push(t.textContent));
        }

        // 为成绩建立 sharedString 索引
        const scoreIdxMap = new Map();
        for (const row of studentRows) {
          if (!row.entered) continue;
          const s = String(row.score);
          let idx = sharedStrings.indexOf(s);
          if (idx < 0) { idx = sharedStrings.length; sharedStrings.push(s); }
          scoreIdxMap.set(row.name, idx);
        }

        // 重建 sharedStrings.xml
        const ssLines = [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`];
        ssLines.push(`<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sharedStrings.length}" uniqueCount="${sharedStrings.length}">`);
        for (const s of sharedStrings) {
          ssLines.push(`<si><t xml:space="preserve">${s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</t></si>`);
        }
        ssLines.push('</sst>');
        zip.file('xl/sharedStrings.xml', ssLines.join(''));

        // 修改 worksheet
        const doc = new DOMParser().parseFromString(wsXml, 'text/xml');

        // 使用 loadExcel 时记录的列索引
        const colLetter = scoreColIndex >= 0 ? String.fromCharCode(65 + scoreColIndex) : 'B';

        // 写入成绩
        for (const row of studentRows) {
          if (!row.entered) continue;
          const excelRow = row.rowIndex + 1;
          const targetRow = doc.querySelector(`row[r="${excelRow}"]`);
          if (!targetRow) continue;

          const cellRef = `${colLetter}${excelRow}`;
          const ssi = scoreIdxMap.get(row.name);
          let cell = targetRow.querySelector(`c[r="${cellRef}"]`);
          if (cell) {
            cell.setAttribute('t', 's');
            const v = cell.querySelector('v');
            if (v) v.textContent = ssi; else { cell.textContent = ''; cell.appendChild(doc.createElement('v')).textContent = ssi; }
          } else {
            cell = doc.createElement('c');
            cell.setAttribute('r', cellRef);
            cell.setAttribute('t', 's');
            cell.appendChild(doc.createElement('v')).textContent = ssi;
            const cs = [...targetRow.querySelectorAll('c')];
            let ins = false;
            for (const c of cs) {
              const cr = c.getAttribute('r') || '';
              if (cr.replace(/\d/g, '') > colLetter) { c.before(cell); ins = true; break; }
            }
            if (!ins) targetRow.appendChild(cell);
          }
        }

        zip.file(sheetFile, new XMLSerializer().serializeToString(doc));
        const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `成绩已录入.xlsx`;
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus(`已导出 ${enteredNames.size} 条成绩`, 'ok');
      } catch (e) {
        alert('导出失败：' + e.message);
        setStatus('导出失败', 'err');
      }
    }
  </script>
