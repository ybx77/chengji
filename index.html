<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成绩录入</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #a8b4fc;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      border: 1px solid #2a2a45;
    }

    .card-title {
      font-size: 13px;
      color: #6b7db3;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---- 摄像头 ---- */
    .camera-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4/3;
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    #canvas { display: none; }

    .guide-box {
      position: absolute;
      border: 2px dashed rgba(168, 180, 252, 0.5);
      border-radius: 8px;
      pointer-events: none;
    }

    #guide-name {
      top: 40%; left: 5%; width: 45%; height: 35%;
      border-color: rgba(100, 255, 150, 0.6);
    }

    #guide-score {
      top: 40%; right: 5%; width: 45%; height: 35%;
      border-color: rgba(255, 200, 100, 0.6);
    }

    .guide-label {
      position: absolute;
      top: -22px;
      left: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    #guide-name .guide-label { background: rgba(100, 255, 150, 0.2); color: #6dffaa; }
    #guide-score .guide-label { background: rgba(255, 200, 100, 0.2); color: #ffcc66; }

    .guide-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      pointer-events: none;
    }

    /* ---- 识别结果 ---- */
    .result-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .result-box {
      flex: 1;
      background: #12122a;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #2a2a45;
    }

    .result-label {
      font-size: 11px;
      color: #6b7db3;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .result-value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
    }

    .result-value.empty { color: #3a3a5a; font-size: 16px; font-weight: 400; letter-spacing: 0; }

    /* ---- 按钮 ---- */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #5b8dee, #7c6df0);
      color: #fff;
    }

    .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: #2a2a45;
      color: #a8b4fc;
    }

    .btn-secondary:active { background: #33335a; }

    .btn-success {
      background: linear-gradient(135deg, #34c97a, #2ba865);
      color: #fff;
    }

    .btn-success:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---- Excel 区 ---- */
    .file-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="file"] { display: none; }

    .file-label {
      padding: 10px 14px;
      background: #2a2a45;
      border-radius: 10px;
      font-size: 13px;
      color: #a8b4fc;
      cursor: pointer;
      border: 1px solid #3a3a5a;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .file-label:hover { background: #33335a; }

    .file-info {
      font-size: 12px;
      color: #6b7db3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- 已录入列表 ---- */
    .record-list {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .record-list::-webkit-scrollbar { width: 4px; }
    .record-list::-webkit-scrollbar-track { background: transparent; }
    .record-list::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 4px; }

    .record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1e1e35;
      font-size: 14px;
    }

    .record-item:last-child { border-bottom: none; }

    .record-name { color: #c8d0fc; font-weight: 500; }
    .record-score { color: #ffcc66; font-weight: 700; font-size: 16px; }
    .record-time { color: #4a4a7a; font-size: 11px; }

    .empty-hint {
      text-align: center;
      color: #3a3a5a;
      font-size: 13px;
      padding: 24px 0;
    }

    /* ---- 状态栏 ---- */
    #status {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 20px;
      background: #1a1a2e;
      color: #6b7db3;
      margin-bottom: 10px;
      text-align: center;
      border: 1px solid #2a2a45;
      max-width: 480px;
      width: 100%;
      transition: all 0.3s;
    }

    #status.loading {
      color: #ffcc66;
      border-color: rgba(255, 200, 100, 0.3);
    }

    #status.ok {
      color: #6dffaa;
      border-color: rgba(100, 255, 150, 0.3);
    }

    #status.err {
      color: #ff8888;
      border-color: rgba(255, 100, 100, 0.3);
    }

    /* ---- 确认弹窗 ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #2a2a45;
    }

    .modal h2 {
      font-size: 17px;
      color: #a8b4fc;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-field {
      margin-bottom: 14px;
    }

    .modal-field label {
      display: block;
      font-size: 12px;
      color: #6b7db3;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .modal-field input {
      width: 100%;
      padding: 12px;
      background: #12122a;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
    }

    .modal-field input:focus { border-color: #5b8dee; }

    .modal-field input.score { color: #ffcc66; }

    .modal .btn-row { margin-top: 18px; }

    /* ---- OCR 进度环 ---- */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .loading .spinner { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- 导出按钮 ---- */
    .export-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* ---- 识别置信度 ---- */
    .confidence-bar {
      height: 3px;
      background: #2a2a45;
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #5b8dee, #7c6df0);
      transition: width 0.3s;
    }
  </style>
</head>
<body>

  <h1>成绩录入</h1>

  <div id="status">点击「拍照识别」开始</div>

  <!-- 摄像头 -->
  <div class="card">
    <div class="card-title">摄像头</div>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <div id="guide-name" class="guide-box">
        <span class="guide-label">姓名</span>
      </div>
      <div class="guide-hint">将实验报告对准虚线框</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-camera" onclick="toggleCamera()">打开摄像头</button>
      <button class="btn btn-primary" id="btn-capture" onclick="captureAndRecognize()" disabled>
        <span class="spinner"></span>
        <span class="btn-text">拍照识别</span>
      </button>
    </div>
  </div>

    <!-- 识别结果 -->
  <div class="card" id="result-card" style="display:none">
    <div class="card-title">识别结果</div>
    <div class="result-row">
      <div class="result-box">
        <div class="result-label">姓名</div>
        <div class="result-value empty" id="result-name">—</div>
        <div class="confidence-bar"><div class="confidence-fill" id="conf-name" style="width:0%"></div></div>
      </div>
      <div class="result-box">
        <div class="result-label">成绩</div>
        <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px">
          <button class="btn btn-secondary" style="padding:6px 12px;font-size:18px;flex:none" onclick="adjustScore(-5)">−</button>
          <div class="result-value" id="result-score" style="min-width:44px;text-align:center">80</div>
          <button class="btn btn-secondary" style="padding:6px 12px;font-size:18px;flex:none" onclick="adjustScore(5)">+</button>
        </div>
        <div class="confidence-bar"><div class="confidence-fill" id="conf-score" style="width:100%"></div></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="retryRecognize()">重新识别</button>
      <button class="btn btn-success" id="btn-confirm" onclick="showConfirm()" disabled>确认录入</button>
    </div>
  </div>

  <!-- Excel 名单 -->
  <div class="card">
    <div class="card-title">学生名单</div>
    <div class="file-input-wrap">
      <label class="file-label" for="file-excel">📂 导入 Excel</label>
      <input type="file" id="file-excel" accept=".xlsx,.xls" onchange="loadExcel(this.files[0])">
      <span class="file-info" id="excel-info">未导入</span>
    </div>
    <div id="name-list" class="record-list" style="margin-top:10px; max-height:120px">
      <div class="empty-hint">请先导入包含学生姓名的 Excel</div>
    </div>
  </div>

  <!-- 已录入记录 -->
  <div class="card">
    <div class="card-title">已录入 <span id="record-count" style="font-size:11px;color:#3a3a5a">(0)</span></div>
    <div id="record-list" class="record-list">
      <div class="empty-hint">暂无录入记录</div>
    </div>
    <div class="export-row">
      <button class="btn btn-secondary" style="flex:1" onclick="exportExcel()">导出 Excel</button>
      <button class="btn btn-secondary" style="flex:1" onclick="clearRecords()">清空记录</button>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>确认录入</h2>
      <div class="modal-field">
        <label>姓名</label>
        <input type="text" id="modal-name" readonly>
      </div>
      <div class="modal-field">
        <label>成绩</label>
        <div style="text-align:center;font-size:22px;font-weight:700;color:#ffcc66;padding:12px;background:#12122a;border:1px solid #2a2a45;border-radius:10px" id="modal-score-display">80</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-success" onclick="confirmRecord()">确认</button>
      </div>
    </div>
  </div>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // ===== 全局状态 =====
    let stream = null;
    let cameraOn = false;
    let studentNames = [];
    let records = [];
    let currentScore = 80;

    let worker = null;

    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    // ===== 状态提示 =====
    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    // ===== 摄像头 =====
    async function toggleCamera() {
      const btn = document.getElementById('btn-camera');
      if (!cameraOn) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
          });
          video.srcObject = stream;
          await video.play();
          cameraOn = true;
          btn.textContent = '关闭摄像头';
          document.getElementById('btn-capture').disabled = false;
          setStatus('摄像头已打开，请将实验报告对准框线', 'ok');
          initOCRWorker();
        } catch (e) {
          setStatus('摄像头权限被拒绝：' + e.message, 'err');
        }
      } else {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        cameraOn = false;
        btn.textContent = '打开摄像头';
        document.getElementById('btn-capture').disabled = true;
        setStatus('摄像头已关闭', '');
      }
    }

    // ===== OCR Worker 初始化（精简，专注速度）=====
    async function initOCRWorker() {
      if (worker) return;
      setStatus('正在加载 OCR 模型（首次约需30秒）...', 'loading');
      try {
        worker = await Tesseract.createWorker('chi_sim+eng', 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              setStatus(`识别中... ${Math.round(m.progress * 100)}%`, 'loading');
            }
          }
        });
        setStatus('OCR 就绪，请拍照识别', 'ok');
      } catch (e) {
        setStatus('OCR 加载失败：' + e.message, 'err');
      }
    }

    // ===== 拍照并识别（快速单次 OCR）=====
    async function captureAndRecognize() {
      if (!worker) { setStatus('OCR 正在初始化，请稍候', 'loading'); return; }
      if (!cameraOn) { setStatus('请先打开摄像头', 'err'); return; }

      const btn = document.getElementById('btn-capture');
      btn.disabled = true;
      btn.classList.add('loading');
      setStatus('正在拍摄...', 'loading');

      try {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        setStatus('正在识别...', 'loading');
        const result = await worker.recognize(dataUrl);
        const text  = result.data.text;
        const words = result.data.words || [];

        setStatus('正在匹配名单...', 'loading');
        const matchedName = findBestMatch(words, text);
        displayResult(matchedName);

      } catch (e) {
        setStatus('识别失败：' + e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    // ===== 核心匹配：容忍 OCR 错字，用字符级匹配 =====
    function findBestMatch(words, fullText) {
      if (studentNames.length === 0) return null;

      // 提取图中所有汉字（即使 OCR 输出混乱也尽量还原）
      const allChars = [...new Set([...fullText].filter(c => /[\u4e00-\u9fff]/.test(c)))];

      // 提取高置信度的 2~4 字汉字词（优先用）
      const highConfWords = words
        .filter(w => w.text && /[\u4e00-\u9fff]{2,4}/.test(w.text) && (w.confidence || 0) >= 55)
        .sort((a, b) => (b.confidence || 0) - (a.confidence || 0));

      const candidates = [];

      for (const cn of studentNames) {
        // 策略A：高置信度词精确包含名单
        for (const w of highConfWords) {
          if (w.text.includes(cn)) {
            candidates.push({ name: cn, score: 100 });
            break;
          }
        }
        if (candidates.find(c => c.name === cn)) continue;

        // 策略B：编辑距离 <= 1（在候选词中）
        for (const w of highConfWords) {
          if (Math.abs(cn.length - w.text.length) <= 1 && levenshtein(cn, w.text) <= 1) {
            candidates.push({ name: cn, score: 90 });
            break;
          }
        }
        if (candidates.find(c => c.name === cn)) continue;

        // 策略C：字符级匹配容忍错字
        // 统计名单中有多少个字在 allChars 中
        let matchCount = 0;
        for (const ch of cn) {
          if (allChars.includes(ch)) matchCount++;
        }
        const ratio = matchCount / cn.length;
        if (ratio >= 0.8) { // 至少 80% 的字对上了
          candidates.push({ name: cn, score: Math.round(ratio * 100) });
        }
      }

      if (candidates.length > 0) {
        candidates.sort((a, b) => b.score - a.score);
        return candidates[0].name;
      }

      return null;
    }

    // ===== 显示结果 =====
    function displayResult(matchedName) {
      document.getElementById('result-card').style.display = 'block';
      currentScore = 80;

      const nameEl   = document.getElementById('result-name');
      const scoreEl  = document.getElementById('result-score');
      const confName = document.getElementById('conf-name');
      const confScore = document.getElementById('conf-score');

      if (matchedName) {
        nameEl.textContent = matchedName;
        nameEl.className  = 'result-value';
        confName.style.width = '100%';
      } else {
        nameEl.textContent = '未识别到姓名';
        nameEl.className  = 'result-value empty';
        confName.style.width = '0%';
      }

      scoreEl.textContent  = '80';
      scoreEl.className    = 'result-value';
      confScore.style.width = '100%';

      document.getElementById('btn-confirm').disabled = !matchedName;
      setStatus(matchedName ? '识别完成，请核对后确认' : '未识别到姓名，请重新拍照', matchedName ? 'ok' : 'err');
    }

    // ===== 成绩增减（以5为单位）=====
    function adjustScore(delta) {
      currentScore = Math.max(0, Math.min(100, currentScore + delta));
      document.getElementById('result-score').textContent = currentScore;
    }

    // ===== 辅助函数 =====
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (m === 0) return n; if (n === 0) return m;
      const d = Array.from({ length: m + 1 }, (_, i) => [i]);
      for (let j = 0; j <= n; j++) d[0][j] = j;
      for (let i = 1; i <= m; i++)
        for (let j = 1; j <= n; j++)
          d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
      return d[m][n];
    }

    function retryRecognize() {
      document.getElementById('result-card').style.display = 'none';
      setStatus('请重新拍照识别', '');
    }

    // ===== Excel 导入 =====
    async function loadExcel(file) {
      if (!file) return;
      document.getElementById('excel-info').textContent = '加载中...';

      const buf  = await file.arrayBuffer();
      const zip  = await JSZip.loadAsync(buf);
      const sheets = Object.keys(zip.files).filter(k => k.endsWith('.xml') && !k.startsWith('_rels'));

      studentNames = [];

      const skipWords = new Set(['姓名', '成绩', '学号', '分数', '总分', '实验', '班级', '专业', '学院', '学校', '座号', '序号', '编号', '分', '报告', '标题', '课程']);

      for (const sheetFile of sheets) {
        const xml   = await zip.file(sheetFile).async('string');
        const parser = new DOMParser();
        const doc   = parser.parseFromString(xml, 'text/xml');

        const sharedStrings = [];
        const ssFile = zip.file('xl/sharedStrings.xml');
        if (ssFile) {
          const ssXml  = await ssFile.async('string');
          const ssDoc  = parser.parseFromString(ssXml, 'text/xml');
          ssDoc.querySelectorAll('si t').forEach(t => {
            sharedStrings.push(t.textContent.trim());
          });
        }

        const rows = doc.querySelectorAll('row');
        for (const row of rows) {
          for (const cell of row.querySelectorAll('c')) {
            let val = '';
            const t  = cell.getAttribute('t');
            if (t === 's') {
              val = sharedStrings[parseInt(cell.querySelector('v')?.textContent || '0')] || '';
            } else {
              val = cell.querySelector('v')?.textContent || '';
            }
            val = val.trim();
            if (val.length >= 2 && val.length <= 4 && /^[\u4e00-\u9fff]+$/.test(val) && !skipWords.has(val)) {
              if (!studentNames.includes(val)) studentNames.push(val);
            }
          }
        }
      }

      studentNames = [...new Set(studentNames)];
      document.getElementById('excel-info').textContent = studentNames.length + ' 人';
      renderNameList();
      setStatus(`已加载 ${studentNames.length} 名学生`, 'ok');
    }

    function renderNameList() {
      const el = document.getElementById('name-list');
      if (studentNames.length === 0) {
        el.innerHTML = '<div class="empty-hint">未找到学生姓名</div>';
        return;
      }
      el.innerHTML = studentNames.slice(0, 30).map(n =>
        `<span style="display:inline-block;padding:4px 10px;margin:2px;background:#12122a;border-radius:6px;font-size:12px;color:#6b7db3">${n}</span>`
      ).join('') + (studentNames.length > 30 ? `<div style="font-size:12px;color:#3a3a5a;margin-top:6px">...共 ${studentNames.length} 人</div>` : '');
    }

    // ===== 确认录入 =====
    function showConfirm() {
      document.getElementById('modal').classList.add('show');
      document.getElementById('modal-name').value  = document.getElementById('result-name').textContent;
      document.getElementById('modal-score-display').textContent = currentScore;
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function confirmRecord() {
      const name  = document.getElementById('modal-name').value.trim();
      const score = currentScore;
      if (!name)  { alert('请填写姓名'); return; }

      records.push({ name, score, time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) });
      closeModal();
      renderRecords();
      document.getElementById('result-card').style.display = 'none';
      setStatus(`「${name}」的成绩已录入`, 'ok');
    }

    function renderRecords() {
      document.getElementById('record-count').textContent = `(${records.length})`;
      const el = document.getElementById('record-list');
      if (records.length === 0) {
        el.innerHTML = '<div class="empty-hint">暂无录入记录</div>';
        return;
      }
      el.innerHTML = records.map(r =>
        `<div class="record-item">
          <span class="record-name">${r.name}</span>
          <span class="record-score">${r.score}</span>
          <span class="record-time">${r.time}</span>
        </div>`
      ).join('');
    }

    function clearRecords() {
      if (!confirm('确定清空所有录入记录？')) return;
      records = [];
      renderRecords();
      setStatus('已清空记录', '');
    }

    // ===== 导出 Excel =====
    function exportExcel() {
      if (records.length === 0) { alert('没有可导出的记录'); return; }
      let csv = '\uFEFF姓名,成绩,录入时间\n';
      for (const r of records) {
        csv += `${r.name},${r.score},${r.time}\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `成绩录入_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus(`已导出 ${records.length} 条记录`, 'ok');
    }
  </script>

</body>
</html>
